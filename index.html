<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>

    <div class="row">

    </div>
  </div>
</div>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">best-ai-<span class="grad">nsfw-bots</span></a>
    <nav>
      <a href="index.html" class="cur hide-m" data-i18n="nav_girls"></a>
      <a href="platforms.html" class="hide-m" data-i18n="nav_platforms"></a>
      <button class="new-pill" id="new-btn"><span class="dot"></span><span data-i18n="nav_new"></span> <b id="new-count">0</b></button>
      <select class="lang" id="lang" aria-label="Language"></select>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 data-i18n="hero_title"></h1>

    </ul>

</main>

<!-- Profile modal -->
<div class="overlay" id="profile">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="x" aria-label="Close">×</button>

    <div class="body" id="pb"></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span>© <span id="yr"></span> best-ai-nsfw-bots.com · <span data-i18n="footer"></span></span>
    <span><a href="platforms.html" data-i18n="nav_platforms"></a> · <a href="#disclosure" data-i18n="disc_title"></a> · <a href="mailto:contact@best-ai-nsfw-bots.com" data-i18n="contact"></a></span>
  </div>
</footer>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
const ALL_TAGS = [...new Set(PROFILES.flatMap(p => p.tags))];
const active = new Set();
let onlyNew = location.hash === "#new";

function renderTags(){
  const sorted = [...ALL_TAGS].sort((a,b) => tr(a).localeCompare(tr(b), LANG));
  $("#tags").innerHTML = sorted.map(t => {
    const n = PROFILES.filter(p => p.tags.includes(t)).length;
    return `<span class="tag ${active.has(t)?"on":""}" data-t="${esc(t)}">${esc(tr(t))}<small>${n}</small></span>`;
  }).join("");
}

function renderGrid(){
  const q = $("#q").value.trim().toLowerCase();
  let list = PROFILES.filter(p =>
    (!onlyNew || isNew(p)) &&
    [...active].every(t => p.tags.includes(t)) &&
    (!q || [p.name, p.bio, tr(p.bio), pf(p.platform).name, ...p.tags, ...p.tags.map(tr)].join(" ").toLowerCase().includes(q)));
  list.sort($("#sort").value === "name" ? (a,b) => a.name.localeCompare(b.name) : (a,b) => b.added.localeCompare(a.added));

  const filtered = onlyNew || active.size || q;
  $("#count").innerHTML = `<b>${list.length}</b> ` + esc(ui(onlyNew ? "count_new" : "count", {n:""}).trim()) +
    (filtered ? `<button class="clear" id="clear">${esc(ui("clear"))}</button>` : "");
  $("#new-btn").classList.toggle("on", onlyNew);

  $("#grid").innerHTML = list.length ? list.map(p => {
    const P = pf(p.platform), i = PROFILES.indexOf(p);
    return `<article class="pcard" data-i="${i}" tabindex="0" aria-label="${esc(p.name)}">
      ${visual(p.img, P.color, p.name[0])}
      ${isNew(p) ? `<span class="new">${esc(ui("new_badge"))}</span>` : ""}<span class="online"></span>
      <div class="shade"></div>
      <div class="meta"><h3>${esc(p.name)}<span>${p.age}</span></h3>
        <div class="on-pf">${esc(ui("on", {p: P.name}))}</div>
        <div class="chips">${p.tags.slice(0,3).map(t => `<span>${esc(tr(t))}</span>`).join("")}</div>
        ${ctaLink(P, "💬 " + esc(ui("card_btn")), "pchat")}
      </div>
    </article>`;
  }).join("") : `<div class="empty">${esc(ui("empty"))}</div>`;
}

function openProfile(i){
  const p = PROFILES[i], P = pf(p.platform);
  $("#pv").innerHTML = visual(p.img, P.color, p.name[0]);
  $("#pb").innerHTML = `
    <h2>${esc(p.name)}, ${p.age}</h2>
    <div class="sub">${esc(ui("char_on", {p: P.name}))}${isNew(p) ? " · 🆕 " + esc(ui("nav_new")) : ""}</div>
    <p>${esc(tr(p.bio))}</p>
    <div class="chips">${p.tags.map(t => `<span>${esc(tr(t))}</span>`).join("")}</div>
    ${ctaLink(P, "💬 " + esc(ui("chat_with", {name: p.name})) + " →")}
    <div class="note">${esc(ui("opens", {p: P.name}))}</div>`;
  $("#profile").classList.add("show");
}

$("#tags").addEventListener("click", e => {
  const t = e.target.closest(".tag")?.dataset.t; if (!t) return;
  active.has(t) ? active.delete(t) : active.add(t); renderTags(); renderGrid();
});
$("#grid").addEventListener("click", e => {
  if (e.target.closest(".pchat")) return;            // button → affiliate link directly
  const c = e.target.closest(".pcard"); if (c) openProfile(+c.dataset.i);
});
$("#grid").addEventListener("keydown", e => { const c = e.target.closest(".pcard"); if (c && e.key === "Enter" && e.target === c) openProfile(+c.dataset.i); });
$("#profile").addEventListener("click", e => { if (e.target.id === "profile" || e.target.classList.contains("x")) $("#profile").classList.remove("show"); });
$("#new-btn").addEventListener("click", () => { onlyNew = !onlyNew; $("#sort").value = "new"; renderGrid(); window.scrollTo({top: $("#tags").offsetTop - 80, behavior:"smooth"}); });
$("#count").addEventListener("click", e => { if (e.target.id === "clear") { onlyNew = false; active.clear(); $("#q").value = ""; renderTags(); renderGrid(); } });
$("#q").addEventListener("input", renderGrid);
$("#sort").addEventListener("change", renderGrid);

initPage(() => { renderTags(); renderGrid(); $("#profile").classList.remove("show"); });
</script>
</body>
</html>
